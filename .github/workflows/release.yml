name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve app version
        run: |
          set -euo pipefail

          BUILD_SETTINGS="$(
            xcodebuild \
              -project RunCatNeo.xcodeproj \
              -scheme RunCatNeo \
              -configuration Release \
              -showBuildSettings
          )"

          PROJECT_VERSION="$(
            printf '%s\n' "$BUILD_SETTINGS" |
            awk -F '= ' '/MARKETING_VERSION/ { print $2; exit }'
          )"
          BUILD_NUMBER="$(
            printf '%s\n' "$BUILD_SETTINGS" |
            awk -F '= ' '/CURRENT_PROJECT_VERSION/ { print $2; exit }'
          )"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$PROJECT_VERSION"
          fi

          if [[ -z "$VERSION" || -z "$BUILD_NUMBER" ]]; then
            echo "::error::Failed to resolve app version/build number"
            exit 1
          fi

          echo "MARKETING_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CURRENT_PROJECT_VERSION=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Building RuncatTouchBar $VERSION ($BUILD_NUMBER)"

      - name: Build arm64 app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project RunCatNeo.xcodeproj \
            -scheme RunCatNeo \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            clean build

      - name: Validate app version
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/RunCatNeo.app"

          ACTUAL_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          ACTUAL_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")
          ACTUAL_BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")

          echo "Built RuncatTouchBar $ACTUAL_VERSION ($ACTUAL_BUILD)"
          echo "Bundle: $ACTUAL_BUNDLE"

          if [[ "$ACTUAL_VERSION" != "$MARKETING_VERSION" ]]; then
            echo "::error::Expected version $MARKETING_VERSION, got $ACTUAL_VERSION"
            exit 1
          fi
          if [[ "$ACTUAL_BUILD" != "$CURRENT_PROJECT_VERSION" ]]; then
            echo "::error::Expected build $CURRENT_PROJECT_VERSION, got $ACTUAL_BUILD"
            exit 1
          fi
          if [[ "$ACTUAL_BUNDLE" != "dev.nisesimadao.RuncatTouchBar" ]]; then
            echo "::error::Unexpected bundle identifier: $ACTUAL_BUNDLE"
            exit 1
          fi

      - name: Package
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/RunCatNeo.app"
          OUT="build/Build/Products/Release/RuncatTouchBar.app"

          if [[ ! -d "$APP" ]]; then
            echo "::error::RunCatNeo.app not found at $APP"
            exit 1
          fi

          codesign --force --deep --sign - "$APP"
          mv "$APP" "$OUT"

          ditto -c -k --sequesterRsrc --keepParent \
            "$OUT" \
            RuncatTouchBar.zip

          unzip -t RuncatTouchBar.zip
          shasum -a 256 RuncatTouchBar.zip | tee RuncatTouchBar.zip.sha256
          echo "Packaged: $(du -h RuncatTouchBar.zip | cut -f1)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RuncatTouchBar
          path: |
            RuncatTouchBar.zip
            RuncatTouchBar.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: RuncatTouchBar ${{ github.ref_name }}
          files: |
            RuncatTouchBar.zip
            RuncatTouchBar.zip.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
