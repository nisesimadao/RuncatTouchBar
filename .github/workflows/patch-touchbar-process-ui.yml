name: Patch Touch Bar process UI

on:
  push:
    paths:
      - '.github/workflows/patch-touchbar-process-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch process scroller
        env:
          REPLACEMENT_B64: 
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path('LocalPackage/Sources/UserInterface/TouchBar/TouchBarController.swift')
          source = path.read_text()
          start_marker = '@MainActor\nprivate final class ProcessScrollTouchBarItem: NSCustomTouchBarItem {'
          end_marker = '\nprivate struct ProcessEntry: Sendable {'
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          replacement = base64.b64decode(os.environ['REPLACEMENT_B64']).decode()
          path.write_text(source[:start] + replacement + source[end:])
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LocalPackage/Sources/UserInterface/TouchBar/TouchBarController.swift
          git commit -m 'Keep Touch Bar process rows stable'
          git push
