name: Polish Touch Bar monitor

on:
  push:
    paths:
      - '.github/workflows/patch-touchbar-process-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply polish pass
        run: python3 scripts/polish_touchbar.py
      - name: Commit polish pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LocalPackage/Sources/UserInterface/TouchBar/TouchBarController.swift
          git commit -m 'Polish Touch Bar monitor behavior'
          git push
