# One-shot importer. This file deletes itself after the import succeeds.
name: Bootstrap from RunCat Neo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-runcatneo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out RuncatTouchBar
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone RunCat Neo and copy its working tree
        shell: bash
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          git clone --depth 1 https://github.com/runcat-dev/RunCatNeo.git "$temp_dir/RunCatNeo"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            "$temp_dir/RunCatNeo/" ./
          rm -f .github/workflows/bootstrap-runcatneo.yml

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Import RunCat Neo source as development base"
          git push origin HEAD:main
