name: Fix Touch Bar compile

on:
  push:
    paths:
      - '.github/workflows/fix-touchbar-compile.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch unsupported NSButton styling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('LocalPackage/Sources/UserInterface/TouchBar/TouchBarController.swift')
          source = path.read_text()

          replacements = {
              "    case .secondary:\n        button.bezelColor = NSColor.white.withAlphaComponent(0.14)\n": "    case .secondary:\n        break\n",
              "    case .destructive:\n        button.bezelColor = .systemRed\n": "    case .destructive:\n        break\n",
          }

          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'Expected source fragment not found: {old!r}')
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LocalPackage/Sources/UserInterface/TouchBar/TouchBarController.swift
          git commit -m 'Fix Touch Bar action button compilation'
          git push
