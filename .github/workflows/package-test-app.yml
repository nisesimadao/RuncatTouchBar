name: Package test app

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-test-app.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select latest Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcode_path="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)"
          if [ -z "$xcode_path" ]; then
            echo "No Xcode 26 installation found" >&2
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode_path/Contents/Developer" >> "$GITHUB_ENV"
          "$xcode_path/Contents/Developer/usr/bin/xcodebuild" -version

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project RunCatNeo.xcodeproj \
            -scheme RunCatNeo \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -R DerivedData/Build/Products/Debug/RunCatNeo.app dist/RuncatTouchBar.app
          ditto -c -k --sequesterRsrc --keepParent dist/RuncatTouchBar.app RuncatTouchBar-test.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: RuncatTouchBar-test
          path: RuncatTouchBar-test.zip
          if-no-files-found: error
          retention-days: 7
