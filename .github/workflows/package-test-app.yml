name: Build & Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'LocalPackage/**'
      - 'RunCatNeo/**'
      - 'RunCatNeo.xcodeproj/**'
      - '.github/workflows/package-test-app.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build universal app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project RunCatNeo.xcodeproj \
            -scheme RunCatNeo \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/RunCatNeo.app"
          if [ ! -d "$APP" ]; then
            echo "::error::RunCatNeo.app not found at $APP"
            exit 1
          fi

          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist"
          file "$APP/Contents/MacOS/RunCatNeo"
          lipo -info "$APP/Contents/MacOS/RunCatNeo"

          codesign --force --deep --sign - "$APP"
          mv "$APP" "build/Build/Products/Release/RuncatTouchBar.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "build/Build/Products/Release/RuncatTouchBar.app" \
            RuncatTouchBar.zip
          unzip -t RuncatTouchBar.zip
          echo "Packaged: $(du -h RuncatTouchBar.zip | cut -f1)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RuncatTouchBar
          path: RuncatTouchBar.zip
          if-no-files-found: error
          retention-days: 7
