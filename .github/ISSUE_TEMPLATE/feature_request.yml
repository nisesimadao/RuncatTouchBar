name: Feature Request
description: Propose a RuncatTouchBar-specific improvement.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please use English and keep one feature per issue. Read [CONTRIBUTING.md](https://github.com/nisesimadao/RuncatTouchBar/blob/main/CONTRIBUTING.md) first.

        General RunCat Neo features should normally be proposed upstream. Runner requests belong in the [Runner Gallery](https://runcat-dev.github.io/RunnerGallery/).

  - type: textarea
    id: problem
    attributes:
      label: "Problem or use case"
      description: "Describe what is difficult or missing before proposing the implementation."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "Proposed behavior"
    validations:
      required: true

  - type: textarea
    id: touchbar-scope
    attributes:
      label: "Why this belongs in RuncatTouchBar"
      description: "Explain why the change is specific to the Touch Bar / Control Strip integration rather than RunCat Neo generally."
    validations:
      required: true

  - type: textarea
    id: private-api-impact
    attributes:
      label: "Private API or process-control impact (optional)"
      description: "If the proposal adds private Touch Bar API usage or process-control behavior, describe the required surface and failure behavior."
    validations:
      required: false

  - type: textarea
    id: related-issues
    attributes:
      label: "Related issues or references (optional)"
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      options:
        - label: "I have read [CONTRIBUTING.md](https://github.com/nisesimadao/RuncatTouchBar/blob/main/CONTRIBUTING.md)."
          required: true
        - label: "I searched existing issues for duplicates."
          required: true
        - label: "This is not a runner request for the upstream Runner Gallery."
          required: true
