name: Bug Report
description: Report a reproducible RuncatTouchBar problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please use English and keep one reproducible problem per issue. Read [CONTRIBUTING.md](https://github.com/nisesimadao/RuncatTouchBar/blob/main/CONTRIBUTING.md) before filing.

  - type: input
    id: app-version
    attributes:
      label: "RuncatTouchBar version"
      placeholder: "e.g. v0.1.0 or commit SHA"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: "Mac model"
      description: "Include the Touch Bar MacBook Pro model and architecture when known."
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: "macOS version"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: "Affected area"
      options:
        - Control Strip runner
        - Expanded Touch Bar monitor
        - Shared RunCat settings / runner state
        - Process list / Quit / Force Quit
        - Build / install / launch
        - Other
    validations:
      required: true

  - type: textarea
    id: bug-description
    attributes:
      label: "Describe the bug"
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: "How to reproduce"
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: "Expected behavior"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: "Screenshots or logs (optional)"
      description: "Remove private process names, file paths, notifications, or other sensitive information before uploading."
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      options:
        - label: "I have read [CONTRIBUTING.md](https://github.com/nisesimadao/RuncatTouchBar/blob/main/CONTRIBUTING.md)."
          required: true
        - label: "I searched existing issues for duplicates."
          required: true
        - label: "For Touch Bar behavior, I am reporting what happened on physical Touch Bar hardware."
          required: false
